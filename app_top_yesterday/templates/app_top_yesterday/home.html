<!DOCTYPE html>
<html lang="en">

<head>
    <title>輿情分析系統</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</head>

<body>

    <div class="container">
        <div class="row">


            <!-- Here insert the navigation bar -->
            {%include 'navbar.html'%}

            <div class="col-lg-12">

                <h1>熱門人物</h1>
                <p>哪個人物被報導最多次?</p>
            </div>

            <!-- column col-lg-6 card -->
            <div class="col-lg-6 mb-5">
                <div class="card">
                    <div class="card-header">
                        <h3 class="h6 text-uppercase mb-0">篩選條件(資料週期:資料截止時間的前4周)</h3>
                    </div>

                    <div class="card-body">

                        <div class="form-group row">
                            <label class="col-sm-3 form-control-label">新聞類別</label>
                            <div class="col-md-9">
                                <label class="radio-inline"><input type="radio" value="全部" name="cateradio"
                                        checked>全部</label>
                                <label class="radio-inline"><input type="radio" value="電影新聞" name="cateradio">電影新聞</label>
                                <label class="radio-inline"><input type="radio" value="影集新聞" name="cateradio">影集新聞</label>
                                <label class="radio-inline"><input type="radio" value="電影影評" name="cateradio">電影影評</label>
                                <label class="radio-inline"><input type="radio" value="電影專題" name="cateradio">電影專題</label>
                                <small class="form-text text-muted">新聞類別內定值為"全部"新聞</small>
                            </div>

                        </div>
                        <!--form group-->


                        <!-- Number of persons form group -->
                        <div class="form-group row">
                            <label class="col-md-3 form-control-label">多少個熱門詞?</label>
                            <div class="col-md-9">
                                <label class="radio-inline"><input type="radio" value="5" name="topkradio">5</label>
                                <label class="radio-inline"><input type="radio" value="10" name="topkradio"
                                        checked>10</label>
                                <label class="radio-inline"><input type="radio" value="20" name="topkradio">20</label>
                                <label class="radio-inline"><input type="radio" value="30" name="topkradio">30</label>
                                <label class="radio-inline"><input type="radio" value="40" name="topkradio">40</label>
                                <label class="radio-inline"><input type="radio" value="50" name="topkradio">50</label>
                                <label class="radio-inline"><input type="radio" value="60" name="topkradio">60</label>
                                <small class="form-text text-muted">內定值為10</small>
                            </div>
                        </div>
                        <!--form group-->

                    </div>
                    <!--card body-->
                </div>
                <!--card -->
            </div><!-- column -->


            <!-- 繪圖區塊-->
            <div class="col-lg-6 mb-5">
                <div class="card">
                    <div class="card-header">
                        <h3 class="h6 text-uppercase mb-0">熱門關鍵字繪圖</h3>
                    </div>
                    <div class="card-body">
                        <canvas id="mychart"></canvas>
                    </div>
                </div>
            </div><!-- column -->


            <!-- 熱門關鍵字區塊-->
            <div class="col-lg-6 mb-5">
                <div class="card">
                    <div class="card-header">
                        <h3 class="h6 text-uppercase mb-0">熱門關鍵字(頻率次數)</h3>
                    </div>
                    <div class="card-body">

                        <ul id="topkeys"></ul>

                    </div>
                </div>
            </div><!-- column -->


        </div> <!-- row -->
    </div> <!-- container -->

</body>

</html>


<!-- jQuery js-->
<script src="https://code.jquery.com/jquery-3.1.0.min.js"></script>
<!-- chartjs js-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.7.3/Chart.min.js"></script>

<!-- Your JavaScript Codes -->
<script>
    // Show the default chart when page is initialized.
    call_ajax();

    $("input[name='cateradio']").on('change', function () {
        call_ajax();
    }); //event function

    $("input[name='topkradio']").on('change', function () {
        call_ajax();
    }); //event function

    // Here is the Ajax function to draw chart
    function call_ajax() {

        const cate = $("input[name='cateradio']:checked").val();
        const topk = $("input[name='topkradio']:checked").val();

        $.ajax({
            type: "POST", //or GET
            //url: "/topperson/api_get_topPerson/",
            //url: "http://163.18.23.21:8000/topperson/api_get_topPerson/",
            url: "http://127.0.0.1:8000/topyesterday/api_get_topYesterday/",
            data: {
                "news_category": cate,
                "topk": topk
            },
            success: function (received) {
                let chart_data = received.chart_data;
                let wf_pairs = received.wf_pairs;
                console.log(wf_pairs);

                showChart(chart_data);
                showTopKeys(wf_pairs);

            } //ajax function
        }); //ajax
    }; //call_ajax

    //* 顯示關鍵詞資料函數
    function showTopKeys(items) {
        //先清除前一次的資料
        $('#topkeys').empty();

        //將內容加上li標籤附加起來，顯示在顯示區"topkeys"
        for (let i = 0; i < items.length; i++) {
            let item_li = "<li>" + items[i] + "</li>";
            $('#topkeys').append(item_li);
        }
    } //function

//**繪圖函數showChart()
function showChart(chart_data) {

    // 畫圖需要的數據資料
    let values = chart_data.values;
    let labels = chart_data.labels;
    let category = chart_data.category;

    // 第1個變數: 餵給chart的資料
    let data = {
        labels: labels,
        datasets: [{
            label: category,
            data: values,
            backgroundColor: [
                'rgba(255, 99, 132, 0.5)',
                'rgba(54, 162, 235, 0.5)',
                'rgba(255, 206, 86, 0.5)',
                'rgba(75, 192, 192, 0.5)',
                'rgba(153, 102, 255, 0.5)',
                'rgba(255, 159, 64, 0.5)',
                'rgba(255, 99, 132, 0.5)'
            ],
            borderColor: [
                'rgba(255, 99, 132, 1)',
                'rgba(54, 162, 235, 1)',
                'rgba(255, 206, 86, 1)',
                'rgba(75, 192, 192, 1)',
                'rgba(153, 102, 255, 1)',
                'rgba(255, 159, 64, 1)',
                'rgba(255, 99, 132, 1)'
            ],
            borderWidth: 1
        }]
    };

    // 第2個變數: chart的選項
    let options = {
        responsive: true,
        legend: {
            position: 'top',
        },
        title: {
            display: true,
            text: '熱門關鍵字繪圖'
        },
        animation: {
            animateScale: true,
            animateRotate: true
        }
    };

    // 取得在前面html區域欲顯示的圖代號
    let canvas_mychrat = document.getElementById("mychart");

    // **先清除前一個圖 再繪新圖
    if (window.piechart) {
        piechart.destroy();
    }

    // **繪圖(產生一個圖物件變數名稱為piechart)
    // 必須全域變數--注意:前面不要有let, var, const等修飾詞
    // 理由: 我們要讓它存在於網頁全域變數，
    // 這樣我們才方便判斷是否有前一次的圖，如果存在有，要刪除之，否則，很多張圖會疊在一起 
    piechart = new Chart(canvas_mychrat, {
        type: 'pie',
        data: data,
        options: options
    });
} //show chart function

</script>
